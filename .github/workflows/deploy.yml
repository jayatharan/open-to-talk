# Build the web app (apps/web), push the image to GitHub Container Registry, and
# deploy it to the cosmerg.com server (open2talk.cosmerg.com) over SSH.
# One-time server and secrets setup: deploy/README.md.

name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# A new push cancels any older run of this workflow, so only the latest commit deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: name
        # Registry paths must be lowercase.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open2talk-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://open2talk.cosmerg.com' }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Image reference
        id: ref
        # Deploy by digest so the server runs exactly what was just built.
        run: echo "image=${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to server
    needs: build
    # Off until the server is set up (deploy/README.md): set the repository variable DEPLOY_ENABLED=true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://open2talk.cosmerg.com
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/open2talk' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the connection fails if the server's identity changes.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload compose file
        # Variables are expanded locally on purpose (SC2029).
        run: |
          # shellcheck disable=SC2029
          ssh deploy "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'" || {
            echo "::error::$DEPLOY_PATH is missing or not writable by $SSH_USER on the server (deploy/README.md)."
            exit 1
          }
          scp -q deploy/docker-compose.prod.yml "deploy:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029
          # The token is piped over stdin, never placed on a command line, and only
          # valid for this workflow run. Logout afterwards removes it from the server.
          printf '%s' "$GHCR_TOKEN" | ssh deploy "docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null"
          # shellcheck disable=SC2029
          ssh deploy "set -e
            cd '$DEPLOY_PATH'
            export IMAGE='$IMAGE'
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io >/dev/null"

      - name: Wait for healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(ssh deploy "docker inspect -f '{{.State.Health.Status}}' open2talk-web" 2>/dev/null || echo unknown)
            echo "Health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 5
          done
          echo "::error::open2talk-web did not become healthy. Recent logs:"
          ssh deploy "docker logs --tail 60 open2talk-web" || true
          exit 1

      # Only after the new container is healthy, so a failed deploy keeps the previous image.
      - name: Remove old images
        run: |
          ssh deploy 'set -e
            current=$(docker inspect -f "{{.Image}}" open2talk-web)
            repo=$(docker inspect -f "{{.Config.Image}}" open2talk-web | cut -d@ -f1 | cut -d: -f1)
            old=$(docker images "$repo" --no-trunc -q | sort -u | grep -vx "$current" || true)
            [ -n "$old" ] && echo "$old" | xargs docker rmi -f
            docker image prune -f >/dev/null'

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 3 https://open2talk.cosmerg.com/api/health

      - name: Clean up SSH material
        if: always()
        run: rm -rf ~/.ssh
