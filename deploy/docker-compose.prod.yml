# Production compose file for open2talk.cosmerg.com, used on the server by
# .github/workflows/deploy.yml. Runs a prebuilt image from GitHub Container
# Registry; nothing is built on the server. Setup: deploy/README.md.
#
#   IMAGE=ghcr.io/<owner>/open2talk-web@sha256:... docker compose -f docker-compose.prod.yml up -d
#
# open2talk.env (optional, chmod 600) lives next to this file and holds TURN settings;
# see apps/web/.env.example. Rooms live in this one process's memory, so never
# scale this service beyond a single replica.

services:
  web:
    image: ${IMAGE:?Set IMAGE to the image reference to deploy}
    container_name: open2talk-web
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    env_file:
      - path: open2talk.env
        required: false
    environment:
      NEXT_PUBLIC_SITE_URL: https://open2talk.cosmerg.com
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
