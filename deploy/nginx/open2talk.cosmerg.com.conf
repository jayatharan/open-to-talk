# nginx site config for open2talk.cosmerg.com.
#
# Install on the server (as root), see deploy/README.md:
#   cp deploy/nginx/open2talk.cosmerg.com.conf /etc/nginx/sites-available/open2talk.cosmerg.com
#   ln -sf /etc/nginx/sites-available/open2talk.cosmerg.com /etc/nginx/sites-enabled/open2talk.cosmerg.com
#   nginx -t && systemctl reload nginx
#
# Traffic: Cloudflare (proxied, SSL "Full (strict)") -> nginx :443 with the
# cosmerg.com Cloudflare Origin Certificate (covers *.cosmerg.com) -> the
# open2talk-web container on 127.0.0.1:3003 (deploy/docker-compose.prod.yml).

server {
    listen 80;
    listen [::]:80;
    server_name open2talk.cosmerg.com;
    return 301 https://open2talk.cosmerg.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name open2talk.cosmerg.com;

    ssl_certificate     /etc/ssl/cloudflare/cosmerg.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cosmerg.com.key;

    # Signaling envelopes are tiny (the app caps them at 64 KB).
    client_max_body_size 128k;

    # Server-Sent Events: one long-lived stream per participant. No buffering, and
    # a read timeout well above the app's 15s heartbeat.
    location ~ ^/api/rooms/[^/]+/events$ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
